name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: khadka27
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --single-branch --branch output https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/khadka27/khadka27.git output-repo || git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/khadka27/khadka27.git output-repo
          cd output-repo
          git checkout -b output 2>/dev/null || git checkout output
          rm -rf *
          cp -r ../dist/* .
          git add .
          git commit -m "Update snake animation [skip ci]" || echo "No changes to commit"
          git push origin output --force
